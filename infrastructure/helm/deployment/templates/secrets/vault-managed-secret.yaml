{{- $vault := printf "ref+vault://%s/%s" (include "bcparks_vault_mount" .) (required "cms.env.environment is required" .Values.cms.env.environment) -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ template "bcparks_vault_managed_secret" . }}
  labels:
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
# Values are ref+vault:// references, resolved by helm-secrets at deploy time.
# See "Vault-managed secrets" in infrastructure/helm/deployment/README.md.
# Consume each key with secretKeyRef, not envFrom, to keep the notice out of the environment.
stringData:
  {{- include "bcparks_vault_managed_notice" . | nindent 2 }}
  ELASTIC_HOST: "{{ $vault }}/elasticsearch#/ELASTIC_HOST"
  ELASTIC_USERNAME: "{{ $vault }}/elasticsearch#/ELASTIC_USERNAME"
  ELASTIC_PASSWORD: "{{ $vault }}/elasticsearch#/ELASTIC_PASSWORD"
  STRAPI_S3_ACCESS_KEY_ID: "{{ $vault }}/s3-strapi#/S3_ACCESS_KEY_ID"
  STRAPI_S3_ACCESS_SECRET: "{{ $vault }}/s3-strapi#/S3_ACCESS_SECRET"
  STRAPI_S3_BUCKET: "{{ $vault }}/s3-strapi#/S3_BUCKET"
  STRAPI_S3_ENDPOINT: "{{ $vault }}/s3-strapi#/S3_ENDPOINT"
  PARK_NAMES_API_KEY: "{{ $vault }}/park-names-api#/PARK_NAMES_API_KEY"
  REC_SPACE_KEYCLOAK_CLIENT_SECRET: "{{ $vault }}/rec-space-keycloak#/REC_SPACE_KEYCLOAK_CLIENT_SECRET"
