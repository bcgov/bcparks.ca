{{- if not (lookup "v1" "Secret" .Release.Namespace (include "bcparks_strapi_token_secret" .)) -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ template "bcparks_strapi_token_secret" . }}
  labels:
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    "helm.sh/hook-weight": "0"
# Managed by hand. Regenerate the token in Strapi after restoring a database.
stringData:
  STRAPI_API_TOKEN: "value-from-strapi"
{{- end -}}
