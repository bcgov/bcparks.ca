{{- if not (lookup "v1" "Secret" .Release.Namespace (include "bcparks_scheduler_secret" .)) -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ template "bcparks_scheduler_secret" . }}
  labels:
    component: {{ .Values.scheduler.componentName }}
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    "helm.sh/hook-weight": "0"
stringData:
  EMAIL_RECIPIENT_WHITELIST: ""
{{- end -}}
