fullnameOverride: crunchy-postgres

postgresVersion: 17

instances:
  replicas: 2
  dataVolumeClaimSpec:
    storage: 2Gi
  requests:
    cpu: 100m

pgBackRest:
  retention: "15" # Ideally a larger number such as 30 backups/days
  repos:
    volume:
      storage: 2Gi
  s3:
    enabled: true
    # s3-pgbackrest is created with CLI commands that copy the values from Vault. See "S3 backup secret" in README.md.
    createS3Secret: false
    bucket: "parks-cms-test"
    endpoint: "nrs.objectstore.gov.bc.ca"

proxy:
  pgBouncer:
    replicas: 1
