name: Playwright Tests
run-name: Playwright Tests (${{ inputs.suite || 'full-chromium' }}, ${{ inputs.environment || 'prod' }})
on:
  # Run Playwright tests on PRs that modify the E2E tests or the workflow itself.
  # PRs run the full suite in Chromium only, to limit the requests from
  # GitHub's runners to bcparks.ca. Manual runs can pick another browser.
  pull_request:
    branches:
      # QA PRs should target main, which tests against https://bcparks.ca/.
      # The alpha environments are tested with workflow_dispatch runs.
      - main
    paths:
      - tests/e2e/**
      - .github/workflows/playwright.yaml

  # Manual runs from the GitHub UI. publish-gatsby.yaml also starts this after
  # every publish (with `gh workflow run --ref <branch>`, suite=content-check)
  # to detect Gatsby local database corruption, once the rollout has had time
  # to finish.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        type: choice
        default: prod
        options:
          - prod
          - test
          - dev
          - alpha-test
          - alpha-dev
      suite:
        description: Tests to run
        type: choice
        default: full-chromium
        options:
          - full-chromium
          - full-firefox
          - full-webkit
          - content-check
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - name: Set target site
        env:
          # Only manual runs set inputs; PRs use prod and full-chromium
          ENVIRONMENT: ${{ inputs.environment || 'prod' }}
          SUITE: ${{ inputs.suite || 'full-chromium' }}
          LICENSE_PLATE: ${{ secrets.OPENSHIFT_GOLD_LICENSE_PLATE }}
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            base_url="https://bcparks.ca/"
          else
            # Non-prod tests use the Helm default routes, which don't have the
            # ip_whitelist annotation used on the vanity routes. Robots.txt and
            # canonical tags keep them out of search results. Temporary until
            # Caddy handles IP-or-password auth for these environments.
            case "$ENVIRONMENT" in
              alpha-*) release="alpha"; namespace_env="${ENVIRONMENT#alpha-}" ;;
              *) release="main"; namespace_env="$ENVIRONMENT" ;;
            esac
            base_url="https://${release}-public-${LICENSE_PLATE}-${namespace_env}.apps.gold.devops.gov.bc.ca/"
          fi
          if [ "$ENVIRONMENT" = "prod" ]; then
            cms_url="https://cms.bcparks.ca/"
          else
            cms_url="https://${ENVIRONMENT}-cms.bcparks.ca/"
          fi
          echo "ENV=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "CMS_URL=$cms_url" >> "$GITHUB_ENV"
          echo "SUITE=$SUITE" >> "$GITHUB_ENV"
          # The browser to install: the content check runs in Chromium
          case "$SUITE" in
            full-*) echo "BROWSER=${SUITE#full-}" >> "$GITHUB_ENV" ;;
            *) echo "BROWSER=chromium" >> "$GITHUB_ENV" ;;
          esac
        working-directory: .
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: tests/e2e/.nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps "$BROWSER"
      - name: Run Playwright tests
        run: |
          if [ "$SUITE" = "content-check" ]; then
            npm run test:content-check
          else
            npm run "test:$BROWSER"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30
